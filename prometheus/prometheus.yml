global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: "couchbase"
    scheme: http
    metrics_path: /metrics
    basic_auth:
      username: Administrator
      password: password123
    static_configs:
      - targets: ["couchbase:8091"]
        labels:
          cluster: "demo-cluster"
